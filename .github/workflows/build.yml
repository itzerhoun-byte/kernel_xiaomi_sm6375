name: ksun-build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio lz4 zstd clang-18 lld-18 llvm-18 ccache

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-ksun-${{ github.sha }}
          restore-keys: ccache-ksun-

      - name: Integrate KernelSU-Next
        run: |
          git clone --depth 1 --branch legacy https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          ln -sf "$(realpath --relative-to=drivers KernelSU-Next/kernel)" drivers/kernelsu
          grep -q "kernelsu" drivers/Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Pre-patch kernel for KSU legacy
        run: |
          sed -i 's/#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 8, 0)/#if 0/' drivers/kernelsu/hook/patch_memory.c || true
          if ! grep -q '^int path_umount' fs/namespace.c; then
            python3 - <<'PY'
          p = 'fs/namespace.c'
          s = open(p).read()
          can = '''static int can_umount(const struct path *path, int flags)
          {
                  struct mount *mnt = real_mount(path->mnt);
                  if (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))
                          return -EINVAL;
                  if (!may_mount())
                          return -EPERM;
                  if (path->dentry != path->mnt->mnt_root)
                          return -EINVAL;
                  if (!check_mnt(mnt))
                          return -EINVAL;
                  if (mnt->mnt.mnt_flags & MNT_LOCKED)
                          return -EINVAL;
                  if (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))
                          return -EPERM;
                  return 0;
          }
          '''
          um = '''int path_umount(struct path *path, int flags)
          {
                  struct mount *mnt = real_mount(path->mnt);
                  int ret;
                  ret = can_umount(path, flags);
                  if (!ret)
                          ret = do_umount(mnt, flags);
                  dput(path->dentry);
                  mntput_no_expire(mnt);
                  return ret;
          }
          '''
          if 'static bool is_mnt_ns_file' in s and 'int path_umount' not in s:
              s = s.replace('static bool is_mnt_ns_file', can + um + 'static bool is_mnt_ns_file', 1)
              open(p, 'w').write(s)
              print('patched namespace.c')
          PY
          fi
          grep -q 'int path_umount' fs/internal.h || sed -i '/^extern void __init mnt_init/a int path_umount(struct path *path, int flags);' fs/internal.h
          if ! grep -q 'atomic_t filter_count' include/linux/seccomp.h; then
            sed -i '/^\tint mode;/a\\tatomic_t filter_count;' include/linux/seccomp.h
            sed -i '/#include <linux\/thread_info.h>/a #include <linux/atomic.h>' include/linux/seccomp.h
          fi
          echo "--- checks ---"
          grep -n '^int path_umount' fs/namespace.c | head -2
          grep -n 'path_umount' fs/internal.h
          grep -n 'filter_count' include/linux/seccomp.h | head -1

      - name: Build
        env:
          CCACHE_DIR: /home/runner/.ccache
          CCACHE_MAXSIZE: 4G
          KCFLAGS: -Wno-error=implicit-int -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=incompatible-pointer-types
        run: |
          export PATH=/usr/lib/llvm-18/bin:$PATH
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 CC="ccache clang" O=out veux_defconfig
          ./scripts/config --file out/.config -e KSU -d KSU_DEBUG -d KSU_MANUAL_HOOK -d KSU_KPROBES_HOOK -e KSU_SYSCALL_TABLE_HOOK -d DEBUG_INFO -d DEBUG_INFO_DWARF4 -d LTO -d LTO_CLANG -d CFI_CLANG
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 CC="ccache clang" O=out olddefconfig
          grep -E "CONFIG_KSU|CONFIG_KPROBES=|CONFIG_EXT4_FS=|CONFIG_LTO|CONFIG_CFI" out/.config || true
          make -j"$(nproc)" ARCH=arm64 LLVM=1 LLVM_IAS=1 CC="ccache clang" O=out Image
          ccache -s || true
          ls -l out/arch/arm64/boot/Image

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Image
          path: out/arch/arm64/boot/Image
